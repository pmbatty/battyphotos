<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scenario — Noise reduction &amp; sharpening — batty.photos</title>
    <link rel="stylesheet" href="../css/site.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <!-- OpenSeadragon for full-resolution pan / zoom on image click -->
    <link
      rel="preload"
      as="script"
      href="https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/openseadragon.min.js"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-header__brand" href="../">batty.photos</a>
        <span class="site-header__nav">
          <a href="./">Noise reduction &amp; sharpening</a>
        </span>
      </div>
    </header>

    <main class="site-main scenario-main" id="scenario-root" aria-busy="true">
      <p class="scenario__loading">Loading scenario&hellip;</p>
    </main>

    <footer class="site-footer">
      <p>
        Photographs and analysis &copy; Peter Batty. AI image analysis powered
        by <a href="https://github.com/pmbatty/darwain">darwain</a>, using
        Google Gemini vision models.
      </p>
    </footer>

    <!-- Full-screen lightbox: hosts either a single OSD viewer (single-image
         mode) or two stacked OSD viewers with a draggable divider between
         them (comparison mode). -->
    <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Full-resolution viewer">
      <div class="lightbox__bar">
        <div class="lightbox__pickers" id="lightbox-pickers">
          <select class="lightbox__pick" id="lightbox-pick-a" aria-label="Choose left image"></select>
          <span class="lightbox__sep" id="lightbox-sep" aria-hidden="true">&#x21C4;</span>
          <select class="lightbox__pick" id="lightbox-pick-b" aria-label="Choose right image"></select>
          <span class="lightbox__caption" id="lightbox-caption" aria-live="polite"></span>
        </div>
        <div class="lightbox__controls">
          <span class="lightbox__zoom" id="lightbox-zoom" aria-live="polite" aria-label="Current zoom">&hellip;</span>
          <button class="lightbox__btn" type="button" id="lightbox-1to1" title="Zoom to 100% (one source pixel per device pixel)">1:1</button>
          <button class="lightbox__close" type="button" aria-label="Close viewer">&times;</button>
        </div>
      </div>
      <div class="lightbox__stage" id="lightbox-stage">
        <!-- Each layer is an absolutely-positioned shell that the inner OSD viewer
             fills. OSD sets position: relative inline on its host element, so we
             can't put position: absolute on the viewer itself — hence the shell. -->
        <div class="lightbox__layer">
          <div class="lightbox__viewer" id="lightbox-viewer-a"></div>
        </div>
        <div class="lightbox__layer lightbox__layer--top" id="lightbox-layer-b" hidden>
          <div class="lightbox__viewer" id="lightbox-viewer-b"></div>
        </div>
        <div class="lightbox__badge lightbox__badge--left" id="lightbox-badge-left" hidden></div>
        <div class="lightbox__badge lightbox__badge--right" id="lightbox-badge-right" hidden></div>
        <div class="lightbox__divider" id="lightbox-divider" hidden>
          <button
            class="lightbox__divider-handle"
            id="lightbox-divider-handle"
            type="button"
            aria-label="Drag to compare. Arrow keys nudge, double-click resets."
            role="separator"
            aria-orientation="vertical"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="50"
          >
            <span aria-hidden="true">&#x21C4;</span>
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/openseadragon.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
